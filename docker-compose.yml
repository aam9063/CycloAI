# CycloAI development database.
#
# The credentials below are DEVELOPMENT-ONLY: they are supplied by the
# environment (a `.env` file next to this compose file, which is ignored by
# git and never committed) so `docker compose up` gives every contributor an
# identical, working PostgreSQL with pgvector. Compose fails loudly if the
# password is not set, so the stack can never start with a hardcoded value.
# Production credentials are injected by the deployment environment and must
# never be committed here.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cycloai-postgres
    environment:
      POSTGRES_USER: cycloai
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set a value (generate one with: openssl rand -base64 24)}"
      # The database is deliberately named to look disposable: the integration
      # suite (backend/tests/test_db_integration.py) drops the public and
      # extensions schemas, and its fail-closed guard refuses any database
      # whose name does not contain 'test' or 'dev'.
      POSTGRES_DB: cycloai_dev
    ports:
      - "5432:5432"
    volumes:
      - cycloai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycloai -d cycloai_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  cycloai-pgdata:
